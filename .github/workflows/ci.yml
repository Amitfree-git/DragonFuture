name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and locked dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Byte-compile
        run: python -m compileall -q src tests examples scripts alembic
      - name: Tests
        run: pytest -q
      - name: Alembic upgrade/check/downgrade/re-upgrade
        run: |
          tmpdir="$(mktemp -d)"
          export DRAGONBOAT_FUTURES_DATABASE_URL="sqlite:///${tmpdir}/futures_ci.db"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
