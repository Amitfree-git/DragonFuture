name: Import DragonFuture source

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part-* | base64 --decode > /tmp/DragonFuture-source.tar.gz
          tar -xzf /tmp/DragonFuture-source.tar.gz -C .
          rm -rf .upload
          rm -f .github/workflows/import-dragonfuture.yml
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import DragonFuture futures analyst V1'
          git push origin HEAD:main
