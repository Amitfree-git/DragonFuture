[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonfuture"
version = "0.1.0"
description = "Deterministic point-in-time-safe futures market analysis agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "SQLAlchemy>=2.0,<3",
  "fastapi>=0.120,<1",
  "uvicorn>=0.35,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "alembic>=1.16,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
db-futures-init = "dragonboat_ai.futures_agent.infrastructure.database.schema:main"
db-futures-api = "dragonboat_ai.futures_agent.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dragonboat_ai*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests using SQLite persistence",
  "point_in_time: tests guarding against look-ahead leakage",
]

[tool.coverage.run]
source = ["dragonboat_ai.futures_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
